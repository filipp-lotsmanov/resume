name: build-resume

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialise runs per branch/tag. Without this, two pushes to main race on the
# "Commit compiled PDF" step and the loser's push is rejected as non-fast-forward.
# cancel-in-progress stays false: a cancelled run could be killed mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NAME: FILIPP LOTSMANOV
  KEYWORDS: PyTorch,FastAPI,PostgreSQL,Docker,XGBoost,MediaPipe,TorchScript,Kubernetes,Data Science

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 360-minute default, so a degraded
    # apt mirror hangs for six hours instead of failing. 15 is the retry budget
    # below (~12.3 min worst case) plus the ~1 min the rest of the build takes.
    timeout-minutes: 15
    permissions:
      contents: write        # needed for the commit-PDF step below
    steps:
      - uses: actions/checkout@v4

      # Minimal set, derived from dpkg ownership of each required file.
      # texlive-fonts-recommended is NOT optional: charter.sty lives in
      # texlive-latex-base but the Charter Type 1 binaries (bchr8a.pfb) ship
      # here. Without it the build succeeds and silently falls back to
      # Computer Modern - which the font-family check would then catch.
      #
      # Bounded and retried: the ~95 MB comes from azure.archive.ubuntu.com,
      # whose backends degrade intermittently. Acquire::http::Timeout cannot
      # catch that - it is an inactivity timer and resets on every byte, so a
      # 5 KB/s trickle never trips it. Only an external wall-clock cap does.
      # "sudo timeout", not "timeout sudo": the latter signals sudo and leaves
      # the root-owned apt-get child orphaned while still holding the dpkg
      # lock, which poisons every retry.
      # No apt-get clean between attempts, deliberately: a SIGTERMed download
      # leaves files in /var/cache/apt/archives/partial and apt resumes them
      # via HTTP range requests, so cleaning would restart from zero.
      - name: Install TeX Live
        run: |
          set -uo pipefail
          install_texlive() {
            sudo timeout 60 apt-get update -o Acquire::Retries=3 || return 1
            sudo timeout 180 apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              latexmk \
              texlive-latex-base \
              texlive-latex-recommended \
              texlive-latex-extra \
              texlive-fonts-recommended \
              poppler-utils || return 1
          }
          for attempt in 1 2 3; do
            if install_texlive; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt}/3 failed or timed out"
            sleep 10
          done
          echo "::error::TeX Live install failed after 3 attempts"
          exit 1

      - name: Assert font binaries are present
        run: kpsewhich bchr8a.pfb

      - name: Compile
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error resume.tex

      - name: Fail on box warnings
        run: |
          if grep -qE 'Overfull|Underfull' resume.log; then
            grep -E 'Overfull|Underfull' resume.log
            echo "::error::overfull/underfull boxes present"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify PDF invariants
        run: |
          uv run scripts/verify.py resume.pdf \
            --name "$NAME" --max-font-families 2 --keywords "$KEYWORDS"

      # Rendered only after verify passes, so a defective PDF never produces a
      # preview. 150 dpi gives a 1241x1754 px image (~440 KB) - sharp on a
      # HiDPI screen, and GitHub scales it down to the README column width.
      - name: Render page-1 preview
        run: |
          mkdir -p docs
          pdftoppm -png -r 150 -singlefile resume.pdf docs/preview

      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf
          if-no-files-found: error
          retention-days: 90

      # Commit the freshly compiled PDF back to main so the repo always holds
      # the current version at a stable URL. Guards:
      #   - only on a push to the main branch (never PRs, never tags: the
      #     release job owns the PDF on tags)
      #   - the push authenticates with GITHUB_TOKEN, which GitHub refuses to
      #     let trigger further workflow runs, so this cannot loop. A
      #     "[skip ci]" marker would be redundant on top of that, and it would
      #     make main's tip untaggable: a tag pointing at this commit would
      #     skip the whole run, so the release job would never fire.
      #   - "git diff --quiet" skips the commit entirely when the PDF is
      #     byte-identical, so unrelated pushes don't create empty commits
      - name: Commit compiled PDF and preview to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-anchor on the current tip before committing, so the push is always
          # a fast-forward. resume.pdf is tracked, so "reset --hard" would restore
          # the old one - keep the freshly built file outside the work tree first.
          cp resume.pdf docs/preview.png "$RUNNER_TEMP/"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p docs
          cp "$RUNNER_TEMP/resume.pdf" resume.pdf
          cp "$RUNNER_TEMP/preview.png" docs/preview.png
          git add -f resume.pdf docs/preview.png
          if git diff --cached --quiet; then
            echo "PDF and preview unchanged - nothing to commit"
          else
            git commit -m "build: update resume.pdf and preview"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-log
          path: resume.log
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resume-pdf
      # Two copies of the same file. The tagged name is the archive record; the
      # constant name is what makes
      #   .../releases/latest/download/Filipp_Lotsmanov_CV.pdf
      # resolve, since that URL redirects by asset FILENAME and so breaks if the
      # name moves with the tag. Paste the constant one into applications.
      - name: Name the release assets
        run: |
          cp resume.pdf "Filipp_Lotsmanov_CV.pdf"
          mv resume.pdf "Filipp_Lotsmanov_CV_${GITHUB_REF_NAME}.pdf"
      - uses: softprops/action-gh-release@v2
        with:
          files: Filipp_Lotsmanov_CV*.pdf
          generate_release_notes: true
